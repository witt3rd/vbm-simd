# scripts/land.conf: this repository's landing configuration (read by the vendored lander from origin/main; data, not code; every key is documented in the vbm-land README).
LAND_BASE=main
# Tier 1 on the rebased combination: the whole gate (about a minute with a warm build).
LAND_GATES_CMD=mise exec -- scripts/tier1.sh
LAND_CI_WORKFLOW=ci.yml
LAND_TIER1_JOB=tier1
LAND_RED_MODE=push
# Size budget: the library and the shims are production code (a `Diff-Budget:` trailer waives it).
LAND_PROD_PATHS=VbmSimd include
LAND_BUDGET_LINES=150
LAND_CONVENTIONAL=1
