# Tier 1 on a push to main only (scripts/land-direct already ran it locally on the exact combination: this is the independent check that defines "main is red", read by the lander);
# Tier 2 (leanchecker, nanoda) on a schedule and on dispatch. Hosted minutes are budgeted: no pull_request trigger. Public-repository rules:
# GitHub-hosted runners only (self-hosted only while .github/visibility says private), no pull_request_target, no secret but the default read-only token; actions are pinned by commit SHA. Trust ledger entry T08.
name: ci
on:
  push:
    branches: [main]
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tier1:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    concurrency:
      group: ci-tier1-${{ github.sha }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2   # installs mise and the pinned Lean (mise.toml)
      - name: cache .lake, so the build is incremental
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .lake
          key: lake-hosted-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.lean') }}-${{ hashFiles('VbmSimd/**', 'VbmSimdProofs/**') }}
          restore-keys: |
            lake-hosted-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.lean') }}-
      - run: mise exec -- scripts/tier1.sh
  tier1-arm64:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    concurrency:
      group: ci-tier1-arm64-${{ github.sha }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2   # installs mise and the pinned Lean (mise.toml)
      - name: cache .lake, so the build is incremental
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .lake
          key: lake-hosted-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean') }}-${{ hashFiles('VbmSimd/**', 'VbmSimdProofs/**') }}
          restore-keys: |
            lake-hosted-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean') }}-
      - run: mise exec -- scripts/tier1.sh
  tier2:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    concurrency:
      group: ci-tier2
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2   # installs mise and the pinned Lean (mise.toml)
      - run: mise exec -- scripts/tier2.sh
